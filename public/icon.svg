<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="chart" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <circle cx="256" cy="256" r="210" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2" />
  
  <!-- Subtle Grid lines -->
  <line x1="80" y1="380" x2="432" y2="380" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2" stroke-dasharray="6,6" />
  <line x1="80" y1="280" x2="432" y2="280" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2" stroke-dasharray="6,6" />
  <line x1="80" y1="180" x2="432" y2="180" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2" stroke-dasharray="6,6" />
  
  <!-- Candlestick / Bars -->
  <rect x="110" y="320" width="24" height="60" rx="4" fill="#10b981" fill-opacity="0.35" />
  <rect x="190" y="250" width="24" height="130" rx="4" fill="#10b981" fill-opacity="0.45" />
  <rect x="270" y="200" width="24" height="180" rx="4" fill="#38bdf8" fill-opacity="0.55" />
  <rect x="350" y="140" width="24" height="240" rx="4" fill="#818cf8" fill-opacity="0.65" />

  <!-- Growth Line Area -->
  <path d="M 80 390 L 122 340 L 202 270 L 282 220 L 362 150 L 432 120 L 432 400 L 80 400 Z" fill="url(#chart)" fill-opacity="0.18" />

  <!-- High Growth Curve Line -->
  <path d="M 80 390 L 122 340 L 202 270 L 282 220 L 362 150 L 432 120" fill="none" stroke="url(#chart)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  
  <!-- Markers -->
  <circle cx="122" cy="340" r="10" fill="#10b981" stroke="#ffffff" stroke-width="4" />
  <circle cx="202" cy="270" r="10" fill="#10b981" stroke="#ffffff" stroke-width="4" />
  <circle cx="282" cy="220" r="10" fill="#06b6d4" stroke="#ffffff" stroke-width="4" />
  <circle cx="362" cy="150" r="12" fill="#38bdf8" stroke="#ffffff" stroke-width="5" />
  <circle cx="432" cy="120" r="16" fill="#38bdf8" stroke="#ffffff" stroke-width="6" />

  <!-- Rupee Badge Symbol -->
  <circle cx="380" cy="360" r="46" fill="#10b981" stroke="#ffffff" stroke-width="4" />
  <text x="380" y="377" font-family="sans-serif" font-size="52" font-weight="900" fill="#ffffff" text-anchor="middle">₹</text>
</svg>